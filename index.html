<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browser Hub</title>
    <link rel="icon" href="src/favicon.png" />
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/renderer.js" defer></script>
  </head>

  <body>
    <form class="toolbar window-titlebar" id="address-form">
      <div class="brand">
        <img src="src/icon.png" alt="" />
        <h1>Browser <strong>Hub</strong></h1>
      </div>
      <div class="navigation-controls">
        <button class="nav-button" id="back-button" type="button" title="Voltar" aria-label="Voltar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
        </button>
        <button class="nav-button" id="forward-button" type="button" title="Avançar" aria-label="Avançar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
        </button>
        <button class="nav-button" id="reload-button" type="button" title="Recarregar" aria-label="Recarregar">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 7v5h-5M4 17v-5h5M5.5 9A7 7 0 0 1 18 6l2 6M4 12l2 6a7 7 0 0 0 12.5-3" />
          </svg>
        </button>
        <button class="nav-button stop-button" id="stop-button" type="button" title="Interromper carregamento" aria-label="Interromper carregamento" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17" /></svg>
        </button>
      </div>

      <div class="address-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7" />
          <path d="m16 16 4 4" />
        </svg>
        <input
          id="address"
          type="text"
          placeholder="Pesquisar ou digitar endereço"
          aria-label="Endereço ou pesquisa"
          autocomplete="off"
          spellcheck="false"
        />
      </div>

      <div class="layout-controls" aria-label="Layout dos painéis">
        <button class="layout-button" type="button" data-layout="single" title="Painel único" aria-label="Painel único">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2" /></svg>
        </button>
        <button class="layout-button" type="button" data-layout="split" title="Tela dividida" aria-label="Tela dividida">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2" /><path d="M12 4v16" /></svg>
        </button>
        <button class="layout-button" type="button" data-layout="grid" title="Grade de painéis" aria-label="Grade de painéis">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="8" height="8" rx="1" /><rect x="13" y="3" width="8" height="8" rx="1" />
            <rect x="3" y="13" width="8" height="8" rx="1" /><rect x="13" y="13" width="8" height="8" rx="1" />
          </svg>
        </button>
      </div>
      <button
        class="manager-button"
        id="open-manager"
        type="button"
        title="Favoritos, histórico, espaços, privacidade e downloads"
        aria-label="Abrir gerenciador do navegador"
        aria-expanded="false"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 5h16M4 12h16M4 19h16" />
          <circle cx="8" cy="5" r="1" />
          <circle cx="16" cy="12" r="1" />
          <circle cx="10" cy="19" r="1" />
        </svg>
      </button>
      <span id="count">0 abas</span>
    </form>

    <div class="tabs-row">
      <section id="panel-list" role="tablist" aria-label="Abas abertas"></section>
      <button
        class="new-tab-button"
        id="new-tab"
        type="button"
        title="Nova aba (Ctrl+T)"
        aria-label="Nova aba"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 5v14M5 12h14" />
        </svg>
      </button>
      <button
        class="restore-button"
        id="restore-closed"
        type="button"
        title="Restaurar aba fechada (Ctrl+Shift+T)"
        aria-label="Restaurar aba fechada recentemente"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 12a9 9 0 1 0 2.64-6.36L3 8m0-5v5h5m4-1v5l3 2" />
        </svg>
      </button>
    </div>

    <div id="status" role="status" aria-live="polite">
      <span class="status-indicator" aria-hidden="true"></span>
      <span class="status-message">Preparando abas...</span>
    </div>

    <div id="tab-context-menu" class="context-menu" role="menu" hidden></div>

    <aside id="manager-sidebar" class="manager-sidebar" aria-label="Gerenciador do navegador" hidden>
      <div class="manager-header">
        <div>
          <span class="manager-eyebrow">BROWSER HUB</span>
          <h2>Biblioteca</h2>
        </div>
        <button id="close-manager" class="manager-close" type="button" aria-label="Fechar" title="Fechar painel">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
        </button>
      </div>
      <div class="manager-body">
        <nav id="manager-nav" class="manager-nav" aria-label="Recursos do navegador">
          <button type="button" data-manager-view="bookmarks" aria-label="Favoritos" title="Favoritos">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v17l-6-4-6 4z" /></svg><span>Favoritos</span>
          </button>
          <button type="button" data-manager-view="history" aria-label="Histórico" title="Histórico">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 2.64-6.36L3 8m0-5v5h5m4-1v5l3 2" /></svg><span>Histórico</span>
          </button>
          <button type="button" data-manager-view="workspaces" aria-label="Espaços de trabalho" title="Espaços de trabalho">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2" /><path d="M3 9h18M9 9v11" /></svg><span>Espaços</span>
          </button>
          <button type="button" data-manager-view="privacy" aria-label="Privacidade" title="Privacidade">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11z" /><path d="m9 12 2 2 4-4" /></svg><span>Privacidade</span>
          </button>
          <button type="button" data-manager-view="downloads" aria-label="Downloads" title="Downloads">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 19h16" /></svg><span>Downloads</span>
          </button>
        </nav>
        <section id="manager-content" class="manager-content" aria-live="polite"></section>
      </div>
    </aside>
  </body>
</html>
